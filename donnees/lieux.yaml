# =============================================================================
#  LIEUX DU BELIET — placement sur la carte (passe « lieux et routes », v0.5)
# =============================================================================
#  Chaque lieu de LIEUX_URBAINS.v2 (56 LUR, 18 ZRS) et chaque extrémité de route
#  non documentée reçoit une CIBLE et des CONTRAINTES. Le script
#  outils/lieux_routes.py cherche, dans le rayon donné, la cellule de la carte qui
#  satisfait au mieux les contraintes (eau, milieu déclaré, altitude, col), puis
#  calcule les caractéristiques physiques du site.
#
#  Champs :
#    cible      [lon, lat] — position visée (raisonnée à partir du corpus)
#    rayon_km   rayon de recherche autour de la cible
#    eau        mer | ocean | lac | fleuve | ile | dans_lac | aucune
#               (rive de la mer Halakhel, de l'océan, d'un lac, d'un fleuve nommé ;
#                île hors continent ; plate-forme sur l'eau d'un lac ; intérieur)
#    milieux    milieux préférés (vocabulaire fermé du Géosystème), dans l'ordre
#    altitude   [min, max] en m (facultatif)
#    meme_que   lieu dont on reprend la position (composante, institution, quartier)
#    confiance  haute | moyenne | faible (faible = position déduite d'indices ténus)
#    note       justification (reprise dans LIEUX_ET_ROUTES.md)
#  Statut de toutes les positions : [PROPOSITION].
# =============================================================================

