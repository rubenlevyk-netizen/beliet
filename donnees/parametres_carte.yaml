# -----------------------------------------------------------------------------
#  CANYONS (v0.5.2) — vallées encaissées déclarées par le corpus [PROPOSITION]
#  Haute Tanāḥil (GEO_VAL_HAUTE_TANAHIL) : « canyon gréseux/marno-calcaire, semi-aride, crues saisonnières »,
#  bassin GEO_FLV_ABNUHIL (Qūrāš-Taniḥīl-Ramšūr, Qūrāš-Tanīqa). Tracé = thalweg calculé sur la carte v0.5.1,
#  du débouché nord du col Abnī-tɨra (001) jusqu'au piémont de l'Abnuḥīl (analogue : Ennedi, wadi Howar).
#  Creusé après l'érosion, avant l'entaille des cols. Le fond descend toujours vers l'aval (pente ≥ pente_min) ;
#  la profondeur est plafonnée et s'annule à l'aval quand le plateau rejoint le fond.
