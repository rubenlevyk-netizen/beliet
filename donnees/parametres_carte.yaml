    garder_au_nord_de: 27.6
    largeur: 3
  - geo_id: GEO_FLV_ABNUHIL_ABNIQA
    noms: ["Abnīqa"]
    # [CANON] bras de décharge vers l'ouest, ~300 km, débouché deltaïque dans l'Halakhel
