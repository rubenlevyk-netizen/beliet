# =============================================================================
#  PARAMÈTRES DE LA CARTE DU BELIET — version 0.3
# =============================================================================
#  Ce fichier contient TOUTES les décisions de placement de la carte.
#  Pour déplacer une chaîne, un lac, un fleuve : on modifie ses coordonnées ici,
#  puis on relance le générateur (outils/generer_carte.py).
#
#  Coordonnées : [longitude, latitude] en degrés décimaux (WGS84).
#    longitude négative = ouest de Greenwich ; latitude négative = sud de l'équateur.
#  Altitudes : mètres. Distances : kilomètres.
#
#  Statuts (repris du corpus) :
#    [CANON]      valeur tirée du Géosystème v3.1, de LIEUX_URBAINS v2 ou de RESEAU_ROUTES v3
#    [INFÉRENCE]  valeur déduite du corpus, non écrite telle quelle
#    [PROPOSITION] choix de placement fait pour cette carte, à valider
#
#  geo_id : identifiant du registre GEOSYSTEME_REGISTRE.v1 quand il existe.
#  La v0.3 repart de la v0.1 (géographie posée sur le relief réel) ; l'illustration
#  TEST_Beliet_MAP.png n'est pas utilisée comme base. Voir ANALYSE_COHERENCE.md.
# =============================================================================

cadre:
  # Emprise de la carte (élargie à l'ouest pour inclure Staur-Khlōr).
  lon_min: -26.5
  lon_max: 53.5
  lat_min: -3.5
  lat_max: 39.0
  # Projection : Web Mercator (EPSG:3857), identique à MAP_BELIET_ORIGIN.svg.
  pixels_par_degre: 62.752      # résolution de travail (≈ 1,8 km/px à l'équateur)
  graine_aleatoire: 1729        # change le « bruit » du relief ; garder fixe pour reproduire

contour:
  # Le contour fourni est l'Afrique réelle en Web Mercator, géoréférencé ainsi :
  fichier: references/MAP_BELIET_ORIGIN.svg
  lon_gauche: -17.53            # cap Vert (x = 0)
  lon_droite: 51.41             # Ras Hafun (x = 2163,07)
  largeur_svg: 2163.07
  lat_haut: 37.35               # Ras ben Sakka, Tunisie (y = 0)

niveaux:
  halakhel_surface_m: -20       # [INFÉRENCE] mer fermée légèrement sous le niveau océanique
  halakhel_profondeur_max_m: 1700   # [CANON]

# -----------------------------------------------------------------------------
#  MER HALAKHEL (GEO_MER_HALAKHEL) — mer intérieure endoréique, d'un seul tenant
#  [CANON] 1 350 000 km², orientation E-O, prof. max 1 700 m, 7 façades
#  Croisement du corpus (ANALYSE_COHERENCE §2) :
#   - façades HKL_NO / HKL_O / HKL_SO et Cherbekh-khem (HKL_S) portent le suffixe _NO (LIEUX) :
#     la moitié occidentale de la mer appartient au Nord-Ouest ;
#   - Tawālmaz et Qabḍ-ār-Ǧanūb (HKL_S) portent le suffixe _NE : la rive S se prolonge vers l'E ;
#   - « NO côtier atlantique » (§V.1) : limite E = Mer Halakhel occidentale ;
#   - portage Kralekh-Aktrik (HKL_NO) → Khloreth-klam (ATL_NO), RT_027 ;
#   - extrémité E : ~300 km d'interfluve jusqu'à l'Abnuḥīl (§V.2).
#  [PROPOSITION] la mer occupe les bas-pays réels : Touat-Tidikelt et Tindouf (O),
#  Ghadamès et Fezzan (centre), bassin de Syrte, Grande Mer de sable et Qattara (E).
#  Conséquence : ~3 400 km d'O en E au lieu de « ~1 800 km » (cf. ANALYSE_COHERENCE §3.1).
# -----------------------------------------------------------------------------
