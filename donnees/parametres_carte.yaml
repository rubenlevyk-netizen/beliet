# -----------------------------------------------------------------------------
#  RELIEF — chaînes (lignes de crête). Chaque point : [lon, lat, altitude crête, demi-largeur km]
#  mode « max » : la chaîne s'élève au-dessus du relief réel.
#  mode « plancher » : on ne relève le relief réel que là où il est plus bas.
#  Les tracés suivent les massifs réels (Adrar, Ahaggar, Djado, Tibesti, Ennedi, Marra, Aïr, Jos).
# -----------------------------------------------------------------------------
chaines:
  - geo_id: GEO_ORO_URUMATI_HALEKH
    nom: "||Urumati-halekh"
    altitude_max_m: 4350         # [CANON] sommets > 4 200 m
    # [CANON] OSO-ENE, ~1 200 km, moy. 2 800 m, sommets > 4 200 m, glaciers relictuels > 3 500 m ;
    #         versants atlantiques humides (O), versants sumdaniens arides (N)
    # [PROPOSITION] de l'Adrar mauritanien (face à Staur-Khlōr, RT_066) au nœud !Okheti (Ahnet)
    mode: max
    rugosite: 1.0
    # v0.3.1 : extrémité ouest en pente vers la côte (collines côtières puis plateau de l'Adrar), socle de piémonts
    socle_m: 450
    socle_km: 230
    points:
      - [-16.3, 20.0, 550, 50]
      - [-15.1, 20.2, 1200, 70]
