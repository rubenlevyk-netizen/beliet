# -----------------------------------------------------------------------------
#  FLEUVES NOMMÉS — tracés de l'amont vers l'aval.
#  « reel: X » = tracé réel de Natural Earth (nom anglais du jeu de données).
# -----------------------------------------------------------------------------
fleuves:
  - geo_id: GEO_FLV_TANAHIL
    noms: ["Tira-ñara", "Tanāḥil"]   # amont (Qoyra) / aval (Šamqir)
    # [PROPOSITION] = Nil Bleu réel ; [CANON] 1 450 km
    reel: ["Abay", "El Bahr el Azraq"]
    largeur: 3
  - geo_id: GEO_FLV_BUHLELA
    noms: ["Buhlela"]
    # [PROPOSITION] = Atbara / Tekezé réels ; [CANON] « sources hors-Beliet E » non résolu
    reel: ["Tekeze", "Setit", "Atbara"]
    largeur: 2
  - geo_id: GEO_FLV_ABNUHIL
    noms: ["Tira-qoyra", "Abnuḥīl"]
    # [PROPOSITION] = Nil réel de Khartoum au seuil de diffluence (≈ 27,6° N)
    reel: ["Nile"]
    couper_au_nord_de: 27.6
    largeur: 4
  - geo_id: GEO_FLV_ABNUHIL_SAFAQIL
    noms: ["Šafāqil"]
    # bras nord vers la Méditerranée = Nil réel en aval de la diffluence + branches du delta
