    noms: ["Tira-ñara", "Tanāḥil"]   # amont (Qoyra) / aval (Šamqir)
    # [PROPOSITION] = Nil Bleu réel ; [CANON] 1 450 km
    reel: ["Abay", "El Bahr el Azraq"]
    largeur: 3
